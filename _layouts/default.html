<title>{{ page.title }}</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1b1f" media="(prefers-color-scheme: dark)">
<!-- This layout serves the Markdown pages, each one folder below the site's
     root (privacy/, pairing-protocol/), so every link starts with "../" and
     the site works at any address. It replaces the GitHub theme's layout,
     which loaded a script from another host. -->
<!-- Sets the light or dark choice before the page is drawn. Its hash is in the
     Content-Security-Policy above: change one, change both (_tools/preview.sh checks it). -->
<script>
(function () {
  var root = document.documentElement, key = "das-cam-theme";
  var dark = window.matchMedia ? matchMedia("(prefers-color-scheme: dark)") : { matches: false };
  function stored() {
    try { var v = localStorage.getItem(key); return v === "light" || v === "dark" ? v : null; } catch (e) { return null; }
  }
  function apply(theme) {
    if (theme) root.setAttribute("data-theme", theme); else root.removeAttribute("data-theme");
  }
  apply(stored());
  document.addEventListener("DOMContentLoaded", function () {
    var group = document.querySelector(".theme-switch");
    if (!group) return;
    var buttons = group.querySelectorAll("button[data-theme-choice]");
    function show() {
      var theme = root.getAttribute("data-theme") || (dark.matches ? "dark" : "light");
      for (var i = 0; i < buttons.length; i++) {
        buttons[i].setAttribute("aria-pressed", buttons[i].getAttribute("data-theme-choice") === theme ? "true" : "false");
      }
      // The browser bar's colour: site.css's --paper for each theme (_tools/preview.sh checks they match).
      var metas = document.querySelectorAll('meta[name="theme-color"]'), bar = { light: "#f3f1ec", dark: "#1a1b1f" }[theme];
      for (var j = 0; j < metas.length; j++) metas[j].setAttribute("content", bar);
    }
    function choose(theme) {
      // A choice that matches the device's setting is not stored, so the page follows the device again.
      var device = dark.matches ? "dark" : "light";
      try { if (theme === device) localStorage.removeItem(key); else localStorage.setItem(key, theme); } catch (e) {}
      apply(theme === device ? null : theme);
      show();
    }
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].addEventListener("click", function () { choose(this.getAttribute("data-theme-choice")); });
    }
    if (dark.addEventListener) dark.addEventListener("change", show); else if (dark.addListener) dark.addListener(show);
    group.hidden = false;
    show();
  });
})();
</script>

        <button type="button" data-theme-choice="dark" aria-pressed="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M13.6 10.1A5.9 5.9 0 0 1 5.9 2.4a5.9 5.9 0 1 0 7.7 7.7Z"/></svg><span class="word">Dark</span></button>
