<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>{{ page.title }}</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0e" media="(prefers-color-scheme: dark)">
<!-- This layout serves the Markdown pages, each one folder below the site's
     root (privacy/, pairing-protocol/), so every link starts with "../" and
     the site works at any address. It replaces the GitHub theme's layout,
     which loaded a script from another host. -->
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/site.css">
<script src="../assets/prose.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="site-header monitor">
  <div class="wrap">
    <a class="brand" href="../">
      <img src="../assets/icon-dark.png" alt="" width="64" height="64">
      <span>Das Cam</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <ul>
        <li class="wide-only"><a href="../#features">Features</a></li>
        <li class="wide-only"><a href="../#devices">Devices</a></li>
        <li class="wide-only"><a href="../#feedback">Feedback</a></li>
        <li><a href="../privacy/">Privacy</a></li>
      </ul>
    </nav>
  </div>
</header>

<main id="main" class="prose">
  <div class="wrap">
{{ content }}
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-top">
      <a class="brand" href="../">
        <picture>
          <source srcset="../assets/icon-dark.png" media="(prefers-color-scheme: dark)">
          <img src="../assets/icon.png" alt="" width="64" height="64">
        </picture>
        <span>Das Cam</span>
      </a>
      <ul class="footer-links">
        <li><a href="../privacy/">Privacy policy</a></li>
        <li><a href="../pairing-protocol/">How pairing works</a></li>
        <li><a href="mailto:contact@env-media.com">contact@env-media.com</a></li>
      </ul>
    </div>
    <p>© 2026 ENV Media, LLC</p>
    <p class="legal">iPhone, iPad and TestFlight are trademarks of Apple Inc.</p>
  </div>
</footer>
</body>
</html>
